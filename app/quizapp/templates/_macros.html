{% macro math(text, cls="") -%}
<div class="mathtext {{ cls }}">{{ text }}</div>
{%- endmacro %}

{% macro mark(ok) -%}
<span class="mark {{ 'ok' if ok else 'ng' }}">{{ '○' if ok else '×' }}</span>
{%- endmacro %}

{% macro report_form(problem, back) -%}
<details class="report">
  <summary>この問題おかしい？</summary>
  <form method="post" action="/problems/{{ problem.id }}/report">
    <input type="hidden" name="back" value="{{ back }}">
    <label>どこがおかしいか（書かなくてもよい）
      <textarea name="note" rows="2" maxlength="1000"></textarea>
    </label>
    <button type="submit" class="secondary">報告する（この問題は今後出ず、記録の集計からも外れます）</button>
  </form>
</details>
{%- endmacro %}

{% macro scope_select(subject, name="scope", selected="", all_label="科目全体から") -%}
<select name="{{ name }}" class="scope" data-subject="{{ subject.id }}">
  <option value="">{{ all_label }}</option>
  {% for unit in subject.units() %}
  <optgroup label="{{ unit.label }}">
    <option value="unit:{{ unit.id }}" {{ 'selected' if selected == 'unit:' ~ unit.id }}>{{ unit.label }}（全部）</option>
    {% for su in unit.subunits %}
    <option value="tmpl:{{ su.id }}" {{ 'selected' if selected == 'tmpl:' ~ su.id }}>　{{ su.label }}</option>
    {% endfor %}
  </optgroup>
  {% endfor %}
</select>
{%- endmacro %}
